<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - Noval</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fce28b;
            margin: 0;
            padding: 20px;
        }
        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .info-item {
            margin-bottom: 15px;
        }
        .info-item strong {
            display: inline-block;
            width: 100px;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 20px 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #a2d149;
            color: #333;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #8bc234;
        }
    </style>
</head>
<body>

<div class="contact-container">
    <h2>Hubungi Saya</h2>
    
    <!-- Detail Informasi Kontak -->
    <div class="info-item">
        <strong>Email:</strong> novalzar98@gmail.com
    </div>
    <div class="info-item">
        <strong>Lokasi:</strong> Jakarta, Indonesia
    </div>
    <div class="info-item">
        <strong>GitHub:</strong> <a href="https://github.com/novalgans232" target="_blank">github.com/noval232</a>
    </div>

    <hr>

    <!-- Form Kirim Pesan -->
    <form action="#" method="POST">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama kamu" required>
        </div>

        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        </div>

        <div class="form-group">
            <label for="subjek">Subjek</label>
            <input type="text" id="subjek" name="subjek" placeholder="Judul pesan" required>
        </div>

        <div class="form-group">
            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan" rows="5" placeholder="Tuliskan pesanmu di sini..." required></textarea>
        </div>

        <button type="submit">Kirim Pesan</button>
    </form>
</div>

</body>
</html>
