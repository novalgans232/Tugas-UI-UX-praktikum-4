<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Black goese bistro | Pizza-on-Demand</h1>
    <p>
        our 12&quet; wood-fired pizzas are available for delivery
    </p>

    <form action="http"://www.blackgoosebistro.com/pizza.php" 
    method="post">
        <fieldset>
            <legend>your information</legend>
            
            <p>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </p>
            <p>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address">
            </p>
            <p>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </p>
            <p>
                 <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </p>
            
            <p>
                <label for ="intructions">delivery intructions;</
                label><br>
                <textarea 
                id="intructions"
                name="intructions"
                rows="4"
                cols="50"
                maxlength="400"
                placeholder="no more than 400 characters.">
            </textarea>
            </p>

            <fieldset>
                <legend>design your dream pizza</legend>
                <p>pizza specs</p>
                <p>pilih 1:</p>

                <p>
                    <input type="radio" id="classic"name="crust"
                    value="Classic White" required>
                    <label for="classic">Classic white</label><br>

                    <input type="radio" id="cheese" name="crust"
                    value="cheese" required>
                    <label for="cheese">Cheese</label><br>

                    <input type="radio" id="gluten" name="crust"
                    value="gluten-free" required>
                    <label for="gluten">Gluten-free</label><br>
                </p>

                <p>toping</p>

                <p>
                    <input type="checkbox" id="pepperoni" name="topping"
                    value="pepperoni">
                    <label for="pepperoni">Pepperoni</label><br>

                    <input type="checkbox" id="mushroom" name="topping"
                    value="mushroom">
                    <label for="mushroom">Mushroom</label><br>

                    <input type="checkbox" id="onion" name="topping"
                    value="onion">
                    <label for="onion">Onion</label><br>

                    <input type="checkbox" id="sausage" name="topping"
                    value="sausage">
                    <label for="sausage">Sausage</label><br>

                    <input type="checkbox" id="bacon" name="topping"
                    value="bacon">
                    <label for="bacon">Bacon</label><br>

                    <input type="checkbox" id="extraCheese" name="topping"
                    value="extra cheese">
                    <label for="extraCheese">Extra Cheese</label><br>

                    <input type="checkbox" id="greenPeppers" name="topping"
                    value="green peppers">
                    <label for="greenPeppers">Green Peppers</label><br>
                </p>

                <p>
                    <label for="quantity">Quantity: </label>
                    <input type="number" id="quantity"
                    name="quantity" min="1" max="10">
                </p>
            </fieldset>
            <p>
                <input type="submit" value="submit">
                <input type="reset" value="reset">
            </p>
        </fieldset>
    </form>
</body>
</html>
